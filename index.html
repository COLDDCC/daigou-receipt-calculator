<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>代购费用核算 · 小票生成</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anybody:wght@500;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&family=DotGothic16&display=swap" rel="stylesheet">
<style>
  :root{
    --field:#EAF3FC;
    --paper:#FFFFFF;
    --ink:#12324E;
    --ink-2:#5D7B96;
    --rule:#1768C9;
    --lead:#D8472E;
    --line:#CBDCEC;
    --ok:#1E8A4C;
    --ok-bg:#EAF7EF;
    --display:'Anybody','Noto Sans SC',system-ui,sans-serif;
    --body:'IBM Plex Sans','Noto Sans SC',system-ui,sans-serif;
    --mono:'IBM Plex Mono','Noto Sans SC',ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--field);
    color:var(--ink);
    font:400 15px/1.6 var(--body);
    -webkit-font-smoothing:antialiased;
    background-image:
      linear-gradient(to right,rgba(23,104,201,.08) .6px,transparent .6px),
      linear-gradient(to bottom,rgba(23,104,201,.08) .6px,transparent .6px);
    background-size:5mm 5mm;
  }
  .wrap{
    max-width:1080px;margin:0 auto;padding:36px 20px 72px;
    display:grid;grid-template-columns:minmax(0,1fr) 520px;gap:44px;align-items:start;
  }
  header{grid-column:1/-1;margin-bottom:4px}
  h1{font:700 24px/1.1 var(--display);letter-spacing:-.01em;margin:0 0 8px}
  header p{margin:0;color:var(--ink-2);font-size:13.5px;max-width:52ch}

  .panel{background:var(--paper);border:1px solid var(--line);padding:20px}
  .panel + .panel{margin-top:18px}
  .panel h2{font:700 11px/1 var(--mono);letter-spacing:.1em;color:var(--ink);margin:0 0 16px;padding-bottom:12px;border-bottom:1.5px solid var(--ink)}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
  .f{display:flex;flex-direction:column;gap:6px;min-width:0}
  .f>label{font:500 10px/1 var(--mono);letter-spacing:.1em;color:var(--ink-2)}
  input,select{
    font-family:var(--body);font-size:15px;color:var(--ink);
    background:#fff;border:1px solid var(--line);border-radius:0;
    padding:9px 11px;width:100%;
  }
  input[type=number],#no,.i-price,.i-qty{font-family:var(--mono)}
  input:focus,select:focus{outline:2px solid var(--rule);outline-offset:1px;border-color:transparent}
  .i-price.price-adjusted{border-color:var(--ok);color:var(--ok);background:var(--ok-bg);font-weight:500}
  .row.row-missing{opacity:.7}
  .row.row-missing .i-name,.row.row-missing .i-price{text-decoration:line-through;color:var(--ink-2);background:#F4F7FA}
  textarea{
    font-family:var(--mono);font-size:13px;color:var(--ink);
    background:#fff;border:1px solid var(--line);border-radius:0;
    padding:9px 11px;width:100%;resize:vertical;min-height:84px;
  }
  textarea:focus{outline:2px solid var(--rule);outline-offset:1px;border-color:transparent}
  .hint{font-size:11.5px;color:var(--ink-2);margin-top:-2px}

  .rows{display:flex;flex-direction:column;gap:10px}
  .row{display:grid;grid-template-columns:84px minmax(0,1fr) 108px 62px 40px 32px;gap:8px;align-items:end}
  .row .rm{
    background:#fff;border:1px solid var(--line);color:var(--ink-2);
    border-radius:0;height:38px;cursor:pointer;font-size:16px;padding:0;
  }
  .row .rm:hover{color:var(--lead);border-color:var(--lead)}
  .row-head{display:grid;grid-template-columns:84px minmax(0,1fr) 108px 62px 40px 32px;gap:8px;font:500 10px/1 var(--mono);letter-spacing:.1em;color:var(--ink-2);margin-bottom:2px}
  .row .nd{display:flex;align-items:center;justify-content:center;height:38px;border:1px solid var(--line)}
  .row .nd input{width:16px;height:16px;margin:0;cursor:pointer;accent-color:var(--lead)}

  .seg{display:flex;border:1px solid var(--line)}
  .seg button{
    flex:1;font:500 11px var(--mono);letter-spacing:0;padding:9px 2px;white-space:nowrap;
    background:#fff;border:0;border-right:1px solid var(--line);cursor:pointer;color:var(--ink-2);
  }
  .seg button:last-child{border-right:0}
  .seg button[aria-pressed="true"]{background:var(--rule);color:#fff}

  .btn{
    font-family:var(--mono);font-size:13px;font-weight:500;letter-spacing:.05em;cursor:pointer;
    border-radius:0;padding:10px 16px;border:1px solid var(--line);
    background:#fff;color:var(--ink-2);
  }
  .btn:hover{border-color:var(--rule);color:var(--rule)}
  .btn-solid{background:var(--rule);border-color:var(--rule);color:#fff;text-transform:uppercase}
  .btn-solid:hover{background:var(--ink);border-color:var(--ink);color:#fff}
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}

  .chip{
    font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:.03em;cursor:pointer;
    border-radius:0;padding:8px 12px;border:1px solid var(--line);background:#fff;color:var(--ink-2);
  }
  .chip:hover{border-color:var(--rule);color:var(--rule)}
  .chip[aria-pressed="true"]{background:var(--rule);border-color:var(--rule);color:#fff}
  .chip.done{border-color:var(--ink);color:var(--ink)}
  .chip.done[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}

  .preview{position:sticky;top:28px}
  .preview canvas{width:100%;height:auto;display:block}
  .note{color:var(--ink-2);font-size:12.5px;margin-top:12px;min-height:1.6em}

  @media (max-width:920px){
    .wrap{grid-template-columns:1fr;gap:28px}
    .preview{position:static}
    .row,.row-head{grid-template-columns:56px minmax(0,1fr) 84px 46px 36px 32px}
  }
  @media (max-width:480px){
    .grid3{grid-template-columns:1fr}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>代购费用核算</h1>
    <p>填完自动出小票，下载图片发给客户，付款和到货后按单号核对。</p>
  </header>

  <div>
    <div class="panel">
      <h2>从表格导入</h2>
      <div class="f">
        <label for="importText">粘贴登记表内容</label>
        <textarea id="importText" rows="4" placeholder="从 Excel / WPS 复制品名和单价，粘贴到这里&#10;支持「品名␉单价」或「品名␉单价␉数量」，用 Tab / 逗号 / 两个以上空格分列&#10;带表头且有「编号」列或商品链接时会记下品番，方便后面按结算表核对&#10;单独一行写「客户：昵称」会自动填到下面的客户"></textarea>
        <span class="hint">按 Tab、逗号或多个空格分列都能识别</span>
      </div>
      <div class="actions">
        <button class="btn btn-solid" id="importBtn">解析导入</button>
      </div>
    </div>

    <div class="panel" id="batchPanel" hidden>
      <h2>本批客户</h2>
      <p class="hint" style="margin-bottom:10px">本批实际买到 <b id="batchTotalQty">0</b> 点，点客户名切到 TA 的商品和总点数，生成完点「下载小票」再切下一个</p>
      <div class="actions" id="batchChips" style="margin-top:0"></div>
    </div>

    <div class="panel">
      <h2>商品明细</h2>
      <div class="row-head"><span>编号</span><span>品名</span><span>日元单价</span><span>数量</span><span title="这件不参与「费用设置」里的整单折扣，按原价结算">不打折</span><span></span></div>
      <div class="rows" id="rows"></div>
      <div class="actions">
        <button class="btn" id="addRow">+ 再加一行</button>
      </div>
    </div>

    <div class="panel">
      <h2>二次核算 · 最终价格核对</h2>
      <div class="f">
        <label for="finalizeText">粘贴骏河屋结算表</label>
        <textarea id="finalizeText" rows="4" placeholder="等骏河屋出最终结算单后，连表头一起粘过来（品番␉商品タイトル␉単価␉数量␉金額）&#10;金额一律以「金額」列为准：骏河屋已经把该行折扣扣掉、并且进位到整数日元&#10;登记表里有、结算表里没有的商品 = 没买到，会标成「未购入」，不计钱也不计点数"></textarea>
        <span class="hint">优先按品番匹配（登记表里的商品链接末段也算品番），对不上才退回按品名匹配</span>
      </div>
      <div class="actions">
        <button class="btn btn-solid" id="finalizeBtn">核对最终价格</button>
      </div>
      <p class="hint" id="finalizeNote" style="margin-top:10px;min-height:1.6em"></p>
    </div>

    <div class="panel">
      <h2>费用设置</h2>
      <div class="grid3">
        <div class="f">
          <label for="discount">折扣（几折）</label>
          <input id="discount" type="number" step="0.1" min="0" max="10" value="9">
          <span class="hint">10 = 不打折</span>
        </div>
        <div class="f">
          <label for="rate">汇率</label>
          <input id="rate" type="number" step="0.001" min="0.0001" value="0.046">
          <span class="hint">1 日元 = ? 元</span>
        </div>
        <div class="f">
          <label>尾数</label>
          <div class="seg" id="roundSeg" role="group">
            <button type="button" data-v="none" aria-pressed="true">保留分</button>
            <button type="button" data-v="jiao" aria-pressed="false">进位角</button>
            <button type="button" data-v="yuan" aria-pressed="false">进位元</button>
          </div>
          <span class="hint">抹零方式</span>
        </div>
      </div>
      <div class="grid2" style="margin-top:14px">
        <div class="f">
          <label for="fee">通讯费总额</label>
          <input id="fee" type="number" step="0.01" min="0" value="0">
          <span class="hint">按总点数平摊，每批单独填，不会留到下一批</span>
        </div>
        <div class="f">
          <label>通讯费币种</label>
          <div class="seg" id="feeCurSeg" role="group">
            <button type="button" data-v="JPY" aria-pressed="true">日元</button>
            <button type="button" data-v="CNY" aria-pressed="false">人民币</button>
          </div>
        </div>
      </div>
      <div class="grid2" style="margin-top:14px">
        <div class="f">
          <label for="ship">运费总额</label>
          <input id="ship" type="number" step="0.01" min="0" value="0">
          <span class="hint">日元，按总点数平摊，每批单独填</span>
        </div>
        <div class="f">
          <label for="batchQty">本次总点数</label>
          <input id="batchQty" type="number" step="1" min="0" placeholder="留空 = 按本人件数">
          <span class="hint">多人合买一起下单时，填全部人的总点数</span>
        </div>
      </div>
    </div>

    <div class="panel">
      <h2>单据信息</h2>
      <div class="grid3">
        <div class="f"><label for="cust">客户</label><input id="cust" type="text" placeholder="昵称"></div>
        <div class="f"><label for="date">日期</label><input id="date" type="date"></div>
        <div class="f"><label for="no">单号</label><input id="no" type="text"></div>
      </div>
    </div>
  </div>

  <div class="preview">
    <canvas id="cv"></canvas>
    <div class="actions">
      <button class="btn btn-solid" id="dl">下载小票</button>
      <button class="btn" id="cp">复制图片</button>
    </div>
    <p class="note" id="note"></p>
  </div>

</div>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const rowsEl = $('rows'), cv = $('cv'), ctx = cv.getContext('2d');
  const noteEl = $('note');

  const MONO = '"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "Noto Sans SC", "PingFang SC", monospace';
  const DIGIT = '"DotGothic16", "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace';

  /* ---------- 分段按钮 ---------- */
  function segValue(segId){
    const btn = document.querySelector('#' + segId + ' button[aria-pressed="true"]');
    return btn ? btn.dataset.v : null;
  }
  function setSeg(segId, v){
    document.querySelectorAll('#' + segId + ' button').forEach(b => {
      b.setAttribute('aria-pressed', b.dataset.v === v ? 'true' : 'false');
    });
  }
  document.querySelectorAll('.seg button').forEach(b => {
    b.addEventListener('click', () => { setSeg(b.closest('.seg').id, b.dataset.v); render(); });
  });

  /* ---------- 表单 ---------- */
  // 一行 = 登记表里的一条「谁要了哪本」。跟结算表核对过之后，这行还会挂上核对结果：
  //   settled  = 结算表里买到了，settleAmt = 结算表「金額」列，骏河屋实际扣的整数日元
  //   missing  = 结算表里根本没有这件，也就是没买到：金额、件数、总点数一律不算它
  function addRow(it){
    it = it || {};
    const d = document.createElement('div');
    d.className = 'row';
    d.innerHTML =
      '<div class="f"><input type="text" class="i-no" placeholder="编号"></div>' +
      '<div class="f"><input type="text" class="i-name" placeholder="商品名"></div>' +
      '<div class="f"><input type="number" class="i-price" min="0" step="1" placeholder="0"></div>' +
      '<div class="f"><input type="number" class="i-qty" min="1" step="1" value="1"></div>' +
      '<div class="nd"><input type="checkbox" class="i-nodiscount" title="这件不参与整单折扣，按原价结算"></div>' +
      '<button class="rm" title="删除这行">×</button>';
    d.querySelector('.i-no').value = it.no || '';
    d.querySelector('.i-name').value = it.name || '';
    d.querySelector('.i-price').value = it.price != null ? it.price : '';
    d.querySelector('.i-qty').value = it.qty != null ? it.qty : 1;
    d.querySelector('.i-nodiscount').checked = !!it.noDiscount;
    if (it.origPrice != null) d.dataset.origPrice = it.origPrice;
    if (it.settled && it.settleAmt != null){ d.dataset.settled = '1'; d.dataset.settleAmt = it.settleAmt; }
    if (it.missing) d.dataset.missing = '1';
    if (it.odd){ d.dataset.odd = '1'; d.dataset.oddWhy = it.oddWhy || ''; }
    markRow(d);
    d.querySelector('.rm').addEventListener('click', () => {
      if (rowsEl.children.length > 1) { d.remove(); render(); }
    });
    rowsEl.appendChild(d);
    return d;
  }

  // 未购入的行在表单里划掉，免得对着屏幕核对时以为它还算钱
  function markRow(r){
    const miss = r.dataset.missing === '1';
    r.classList.toggle('row-missing', miss);
    r.querySelector('.i-name').title = miss
      ? '结算表里没有这件（没买到），不计金额、不计件数、不计总点数；要彻底去掉就删这行'
      : '';
  }

  function renderRows(items){
    rowsEl.innerHTML = '';
    (items.length ? items : [{}]).forEach(it => addRow(it));
  }

  function readItems(){
    return [...rowsEl.children].map(r => ({
      el: r,
      no: r.querySelector('.i-no').value.trim(),
      name: r.querySelector('.i-name').value.trim(),
      price: +r.querySelector('.i-price').value || 0,
      qty: Math.max(1, Math.round(+r.querySelector('.i-qty').value || 1)),
      noDiscount: r.querySelector('.i-nodiscount').checked,
      origPrice: r.dataset.origPrice != null ? +r.dataset.origPrice : null,
      settled: r.dataset.settled === '1',
      settleAmt: r.dataset.settleAmt != null ? +r.dataset.settleAmt : null,
      missing: r.dataset.missing === '1',
      odd: r.dataset.odd === '1',
      oddWhy: r.dataset.oddWhy || ''
    })).filter(i => i.price > 0 || i.name);
  }

  // 存回批次数据时要把 DOM 引用摘掉，不然换客户之后指向的还是上一批已经被扔掉的节点
  const stripEl = it => { const { el, ...rest } = it; return rest; };

  /* ---------- 表格导入 ---------- */
  const CUST_RE = /^(客户|买家|收件人|昵称)[:：]\s*(.+)$/;
  const URL_RE = /^https?:\/\//i;
  const TOTAL_RE = /^(合计|总计|小计|共计|total|subtotal)/i;
  const cleanNum = s => String(s).trim().replace(/^[×x*]\s*/i, '').replace(/[¥￥$,，\s]/g, '');
  const isNumericCell = c => { const n = cleanNum(c); return n !== '' && /^\d+(\.\d+)?$/.test(n); };

  // 日文汉字跟对应的中文简体字形很像，但是不同的 Unicode 字符（単≠单、価≠价、額≠额），
  // 骏河屋结算单表头是日文（品番/商品タイトル/単価/数量/金額），下面的规则中日文写法都要认。
  const H_NAME_RE = /^(名称|品名|商品名?|标题|name|item|item ?name|product|product ?name|title|description|商品タイトル|タイトル)$/i;
  const H_PRICE_STRICT_RE = /(实际价格|到手价|成交价|实付|现价|actual price|final price|settled price)/i;
  const H_PRICE_RE = /(价格|单价|价|単価|価格|price)/i;
  const H_QTY_RE = /^(数量|件数|个数|qty|quantity)$/i;
  const H_CUST_RE = /^(客户|买家|收件人|昵称|cn|customer|buyer|client)$/i;
  const H_NO_RE = /^(编号|货号|番号|商品编号|管理番号|型号|sku|no\.?|item ?no\.?|品番|code|item ?code|product ?code|number)$/i;
  const H_AMOUNT_RE = /^(金额|金額|合计金额|合計金額|amount|total|subtotal|line ?total)$/i;
  // 结算表的「枝番」被 Excel 当成日期，1-1 会变成「1月1日」——这一列没有任何用处，
  // 明确忽略掉，绝不拿它当品番/品名，也不靠它排序（下面的匹配全部按品番来）。
  const H_IGNORE_RE = /^(枝番|備考|备考|备注|注釈|remark|note|memo|状態|状态)$/i;

  // 登记表里常常不写编号，只贴商品链接，品番就是链接的最后一段：
  // https://www.suruga-ya.jp/product/detail/185185606 → 185185606
  function noFromUrl(cell){
    const v = String(cell || '').trim();
    if (!URL_RE.test(v)) return '';
    const seg = v.split(/[?#]/)[0].replace(/\/+$/, '').split('/').pop() || '';
    return /^[A-Za-z0-9_-]{4,}$/.test(seg) ? seg : '';
  }
  // 骏河屋的品番就两种长相：字母前缀+数字（ZHOTI664153、ZHONA296970、ZHOTO90917），
  // 或者一长串纯数字（863022409001）。登记表里这一列的表头五花八门（品番コード、
  // 商品番号、货号、干脆没表头……），认不出表头时就按长相认——按品番匹配是二次核算里
  // 最靠得住的一条路，能多捞回一列品番就少一批对不上的商品。
  const CODE_RE = /^(?:[A-Z]{2,6}[-_]?\d{4,}|\d{9,13})$/i;
  const looksLikeCode = c => CODE_RE.test(String(c == null ? '' : c).trim());

  // 先认商品链接（链接末段就是品番），再退回按长相在各列里找。skip 是已经知道用途的
  // 列（价格/数量/金额/品名），不能被当成品番。
  const noFromCells = (cells, skip) => {
    for (const c of cells){ const n = noFromUrl(c); if (n) return n; }
    for (let i = 0; i < cells.length; i++){
      if (skip && skip.indexOf(i) !== -1) continue;
      const t = (cells[i] || '').trim();
      if (looksLikeCode(t)) return t;
    }
    return '';
  };

  // 提示信息里要塞进原始行或者长长的日文标题时，先压成一小段，免得一条提示变成一堵
  // 读不下去的墙（骏河屋的同人志标题动辄七八十个字符）。
  const brief = (str, n) => {
    const t = String(str == null ? '' : str).replace(/\s+/g, ' ').trim();
    return t.length > (n || 24) ? t.slice(0, n || 24) + '…' : t;
  };

  // 识别第一行是不是表头（含"名称/价格/数量/客户/编号"这类关键词，中日文写法都认），
  // 是的话记下每个字段在哪一列——两个价格列（原价+实际价格）时优先用"实际/到手"这个，
  // 不再瞎猜"第二个数字是数量"。有编号列的话记下来，二次核算时优先按编号匹配。
  // 有「金额/金額」列（骏河屋结算单会把该行折扣额已经扣掉算进金額）时，优先用
  // 金額÷数量 当作这行的实际单价，比单价列更准。
  function detectHeader(cells){
    const trimmed = cells.map(c => (c || '').trim());
    let nameCol = -1, priceCol = -1, priceStrictCol = -1, qtyCol = -1, custCol = -1, noCol = -1, amtCol = -1;
    trimmed.forEach((c, i) => {
      if (!c || H_IGNORE_RE.test(c)) return;
      if (nameCol === -1 && H_NAME_RE.test(c)) nameCol = i;
      if (H_PRICE_STRICT_RE.test(c)) priceStrictCol = i;
      else if (H_PRICE_RE.test(c)) priceCol = i;
      if (H_QTY_RE.test(c)) qtyCol = i;
      if (H_CUST_RE.test(c)) custCol = i;
      if (H_NO_RE.test(c)) noCol = i;
      if (H_AMOUNT_RE.test(c)) amtCol = i;
    });
    const finalPriceCol = priceStrictCol !== -1 ? priceStrictCol : priceCol;
    if (nameCol === -1 || (finalPriceCol === -1 && amtCol === -1)) return null;
    return { nameCol, priceCol: finalPriceCol, qtyCol, custCol, noCol, amtCol };
  }

  // 把一行数据按表头读成 {品番, 品名, 单价, 数量, 金额}。
  // 金额一律优先用「金額」列：骏河屋结算单在这一列里已经把该行的値引額扣掉、
  // 并且进位到了整数日元，是真正扣款的数；只有単価列时才用 単価 × 数量 反推。
  function headerRow(cells, header){
    const name = (cells[header.nameCol] || '').trim();
    const qtyRaw = header.qtyCol !== -1 ? parseFloat(cleanNum(cells[header.qtyCol] || '')) : NaN;
    const qty = Math.max(1, Math.round(qtyRaw) || 1);
    let amount = header.amtCol !== -1 ? parseFloat(cleanNum(cells[header.amtCol] || '')) : NaN;
    let price = header.priceCol !== -1 ? parseFloat(cleanNum(cells[header.priceCol] || '')) : NaN;
    if (!(amount > 0) && price > 0) amount = price * qty;
    if (!(price > 0) && amount > 0) price = amount / qty;
    if (!name || !(amount > 0) || TOTAL_RE.test(name)) return null;
    let no = header.noCol !== -1 ? (cells[header.noCol] || '').trim() : '';
    if (!no) no = noFromCells(cells,
      [header.priceCol, header.qtyCol, header.amtCol, header.nameCol]);
    return { name, price, qty, amount, no };
  }

  // 只裁行尾空白：行首那个 Tab 是「第一列是空的」（结算表某行没填品番就长这样），
  // 整行 trim 掉会让后面每一列都往左错一位，整行读出来全是错的。
  // 按空格分列时行首空白不算列，那一档才允许整行 trim。
  function splitCells(line){
    const row = String(line).replace(/\s+$/, '');
    let cells = row.split('\t');
    if (cells.length < 2) cells = row.split(',');
    if (cells.length < 2) cells = row.trim().split(/\s+/);
    return cells.map(s => s.trim());
  }

  // 从分好列的单元格里找品名/单价/数量：从左往右找第一个数字列当单价（自动跳过
  // 空单元格和链接），紧接着下一个数字列当数量；单价前面所有非数字非链接的列拼起来当品名
  // ——这样"品名/单价/数量"三列和"品名里带空格、按空格拆词"两种粘贴方式都能对。
  function parseCells(cells){
    const trimmed = cells.map(c => (c || '').trim());
    let priceIdx = -1, price = 0;
    for (let i = 0; i < trimmed.length; i++){
      const c = trimmed[i];
      if (!c || URL_RE.test(c)) continue;
      if (looksLikeCode(c)) continue;   // 12 位的品番不是价格
      if (isNumericCell(c)){ price = parseFloat(cleanNum(c)); priceIdx = i; break; }
    }
    if (priceIdx === -1 || price <= 0) return null;

    let qty = 1;
    for (let i = priceIdx + 1; i < trimmed.length; i++){
      const c = trimmed[i];
      if (!c || URL_RE.test(c)) continue;
      if (looksLikeCode(c)) continue;
      if (isNumericCell(c)){ qty = Math.max(1, Math.round(parseFloat(cleanNum(c)))); break; }
    }

    const name = trimmed.slice(0, priceIdx)
      .filter(c => c && !URL_RE.test(c) && !isNumericCell(c) && !looksLikeCode(c))
      .join(' ').trim();
    if (!name || TOTAL_RE.test(name)) return null;
    return { name, price, qty, amount: price * qty, no: noFromCells(trimmed) };
  }

  function parseImport(text){
    const lines = text.split(/\r?\n/).filter(l => l.trim());
    if (!lines.length) return { items: [], cust: null, skipped: 0, skippedLines: [], custNote: '' };

    const items = [];
    let cust = null;
    const skippedLines = [];
    const custTags = new Set();

    const header = detectHeader(splitCells(lines[0]));
    const dataLines = header ? lines.slice(1) : lines;

    dataLines.forEach((rawLine, idx) => {
      const line = rawLine.trim();
      const m = line.match(CUST_RE);
      if (m){ cust = m[2].trim(); return; }

      const cells = splitCells(rawLine);

      if (header){
        const hit = headerRow(cells, header);
        if (hit && hit.price > 0){
          const tag = header.custCol !== -1 ? (cells[header.custCol] || '').trim() : '';
          items.push({ name: hit.name, price: hit.price, qty: hit.qty, no: hit.no, tag });
          if (tag) custTags.add(tag);
          return;
        }
        skippedLines.push(line);
        return;
      }

      const hit = parseCells(cells);
      if (hit){ items.push(hit); return; }

      // 识别不了、又不像客户名的整行：只把"第一行、没有数字"当作隐式客户名，其余计入跳过。
      if (idx === 0 && !cust && !/\d/.test(line)){ cust = line; return; }
      skippedLines.push(line);
    });

    let custNote = '';
    if (!cust && custTags.size === 1){
      cust = [...custTags][0];
    } else if (!cust && custTags.size > 1){
      custNote = '检测到 ' + custTags.size + ' 个不同客户标记（' + [...custTags].join('、') +
        '），这是多人合买的表格，客户栏先留空，请按客户分开粘贴分别生成小票';
    }

    return { items, cust, skipped: skippedLines.length, skippedLines, custNote };
  }

  /* ---------- 多客户合买批次 ---------- */
  const UNTAGGED = '未标注';
  let batchGroups = null;   // Map<客户标签, 商品数组>
  let batchQtyTotal = 0;
  let activeBatchTag = null;
  const batchDone = new Set();

  function buildBatchGroups(items){
    const groups = new Map();
    items.forEach(it => {
      const tag = it.tag || UNTAGGED;
      if (!groups.has(tag)) groups.set(tag, []);
      groups.get(tag).push(it);
    });
    return groups;
  }

  const boughtQty = its => its.filter(i => !i.missing).reduce((s, i) => s + i.qty, 0);
  const missedQty = its => its.filter(i => i.missing).reduce((s, i) => s + i.qty, 0);

  // 本次总点数 = 全批「结算表里真买到」的件数。核对完结算表后未购入的那些必须掉出去，
  // 否则所有按总点数平摊的费用分母都是错的。
  function recalcBatchTotal(){
    if (!batchGroups) return;
    batchQtyTotal = [...batchGroups.values()].reduce((s, its) => s + boughtQty(its), 0);
    $('batchTotalQty').textContent = batchQtyTotal;
  }

  // 切客户前先把当前这位在表单里的改动写回批次数据，不然一切走就丢了
  function syncActiveGroup(){
    if (batchGroups && activeBatchTag && batchGroups.has(activeBatchTag)){
      batchGroups.set(activeBatchTag, readItems().map(stripEl));
    }
  }

  function renderBatchChips(){
    const box = $('batchChips');
    box.innerHTML = '';
    if (!batchGroups) return;
    [...batchGroups.entries()].forEach(([tag, its]) => {
      const qty = boughtQty(its), miss = missedQty(its);
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'chip' + (batchDone.has(tag) ? ' done' : '');
      b.setAttribute('aria-pressed', tag === activeBatchTag ? 'true' : 'false');
      b.textContent = tag + '（' + qty + '件' + (miss ? '，未购入 ' + miss : '') + '）' +
        (batchDone.has(tag) ? ' ✓' : '');
      b.addEventListener('click', () => loadBatchGroup(tag));
      box.appendChild(b);
    });
  }

  function loadBatchGroup(tag){
    const its = batchGroups.get(tag);
    if (!its) return;
    if (activeBatchTag !== tag) syncActiveGroup();
    recalcBatchTotal();
    renderRows(batchGroups.get(tag));
    $('cust').value = tag === UNTAGGED ? '' : tag;
    $('batchQty').value = batchQtyTotal;
    activeBatchTag = tag;
    renderBatchChips();
    render();
  }

  $('importBtn').addEventListener('click', () => {
    const { items, cust, skipped, skippedLines, custNote } = parseImport($('importText').value);
    if (!items.length && !cust){
      noteEl.textContent = '没识别到内容，检查一下格式（品名和单价之间用 Tab、逗号或至少两个空格分隔）。';
      return;
    }

    const distinctTags = new Set(items.map(it => it.tag).filter(Boolean));
    if (distinctTags.size > 1){
      batchGroups = buildBatchGroups(items);
      batchDone.clear();
      activeBatchTag = null;
      recalcBatchTotal();
      $('batchPanel').hidden = false;
      renderBatchChips();
      const [firstTag] = batchGroups.keys();
      loadBatchGroup(firstTag);
      $('importText').value = '';
      noteEl.textContent = '识别到 ' + distinctTags.size + ' 个客户、共 ' + batchQtyTotal +
        ' 件，已加载「' + firstTag + '」，切上面的客户名生成其余小票。';
      return;
    }

    batchGroups = null;
    $('batchPanel').hidden = true;
    if (items.length){
      const allEmpty = [...rowsEl.children].every(r =>
        !r.querySelector('.i-name').value.trim() && !r.querySelector('.i-price').value.trim());
      if (allEmpty) rowsEl.innerHTML = '';
      items.forEach(it => addRow(it));
    }
    if (cust) $('cust').value = cust;
    $('importText').value = '';
    render();
    const msg = [];
    if (items.length) msg.push('导入 ' + items.length + ' 条商品');
    if (cust) msg.push('客户：' + cust);
    if (skipped) msg.push('有 ' + skipped + ' 行没识别出来，已跳过（' +
      skippedLines.slice(0, 3).map(l => brief(l, 20)).join(' ｜ ') +
      (skipped > 3 ? ' 等' : '') + '），这几行不会进登记表，也不会参与二次核算');
    if (custNote) msg.push(custNote);
    noteEl.textContent = msg.join('，') + '。';
  });

  /* ---------- 二次核算：拿骏河屋结算表核对登记表 ---------- */
  // 同一件商品的标题，骏河屋网页、结算表导出、自己打的登记表三处经常不完全一样：
  // 全角字母（Ｖｔｕｂｅｒ）和半角（Vtuber）、！和!、（）和()、空格多一个少一个、
  // 英文大小写……按原样比字符串，带英文的标题几乎必然对不上。
  const normName = s => (s || '')
    .normalize('NFKC')
    .toLowerCase()
    .replace(/[\s\u3000]+/g, '')
    .replace(/[~\u301c\uff5e\-\u2010-\u2015\u30fb,\.:;'"\u2018\u2019\u201c\u201d\u3001\u3002\uff0c\uff0e\uff1a\uff1b\u300c\u300d\u300e\u300f\u3010\u3011\[\]()\uff08\uff09<>\uff1c\uff1e\u300a\u300b]/g, '');

  // 骏河屋的标题前面挂着一长串分类前缀，而且结算表导出和从网页上复制下来的写法不一样
  // （结算表是「中古女性向け一般同人誌（BL含む） <<呪術廻戦>> 御飯再録…」，网页复制下来
  // 是「駿河屋 -<中古>御飯再録…」）。按整串比品名，光是这段前缀就注定对不上，所以再留
  // 一把「削掉分类前缀之后的核心标题」当作退一步的比较依据。
  const stripCat = s => String(s || '')
    .replace(/^駿河屋\s*[-\u2010-\u2015\u2212\u30fc]*\s*/, '')
    .replace(/^[<\uff1c][^>\uff1e]*[>\uff1e]\s*/, '')
    .replace(/^(新品|中古)\S*\s+/, '')
    .trim();
  const coreName = s => normName(stripCat(s));

  // 小票上显示用的品名：削掉骏河屋页面标题两头的商品分类，只留书名本身。
  // 存在表单里的品名不动——匹配靠的是它。
  const SURUGA_TITLE_RE = /^駿河屋\s*[-\u2010-\u2015\u2212\u30fc]*\s*[<\uff1c][^>\uff1e]*[>\uff1e]/;
  const displayName = s => {
    const raw = String(s || '');
    if (!SURUGA_TITLE_RE.test(raw)) return stripCat(raw) || raw.trim();
    return raw.replace(SURUGA_TITLE_RE, '')
      .replace(/[（(][^（()）]*[）)]\s*$/, '')   // 结尾那段分类：（アニメ系）（クッション・抱き枕・本体）……
      .trim() || raw.trim();
  };

  // 标题里的数字基本都是卷数/册数（「まとめ本 2」和「まとめ本 3」、「琥珀の島 3」），
  // 这恰恰是相似度最看不出区别、又最不能认错的地方——差一个数字就是另一本书。
  // 所以凡是靠品名近似认人的那两级，两边的数字必须完全一致，否则一律不认。
  const numsOf = s => (String(s || '').match(/\d+/g) || []).map(Number).sort((a, b) => a - b).join(',');

  // 字符二连的 Dice 相似度：日文标题没有空格可切词，按二连算最省事也够准。
  const bigrams = str => {
    const m = new Map();
    for (let i = 0; i < str.length - 1; i++){
      const g = str.slice(i, i + 2);
      m.set(g, (m.get(g) || 0) + 1);
    }
    return m;
  };
  function diceSim(A, B){
    if (!A || !B || !A.size || !B.size) return 0;
    let inter = 0, total = 0;
    A.forEach((n, g) => { total += n; inter += Math.min(n, B.get(g) || 0); });
    B.forEach(n => { total += n; });
    return total ? 2 * inter / total : 0;
  }

  // 比较品番之前先统一写法：全角折半角、统一大写、去掉 - _ 空格这类分隔符。
  const noKey = s => String(s || '').normalize('NFKC').toUpperCase().replace(/[^0-9A-Z]/g, '');
  // 一律显示削掉分类前缀之后的标题：不然截出来前 24 个字全是
  // 「中古女性向け一般同人誌（BL含む）」，每条长得一模一样，等于没说。
  const labelOf = it => (it.no ? it.no + ' ' : '') + (brief(displayName(it.name), 22) || '未命名');

  // 登记表里的品番常常是商品链接末段（185185606、ZHOTI725238），而骏河屋结算表的
  // 品番后面还会再接 3 位枝番（185185606001，001=中古、000=新品）。所以「短的正好是
  // 长的去掉末尾 3 位数字」也算同一件。
  // 只放宽「恰好多 3 位数字」这一层，不是宽泛的前缀匹配：ZHOTI46174 和 ZHOTI46177
  // 这种同社团连号，宽前缀会互相认错。
  function noMatch(a, b){
    const x = noKey(a), y = noKey(b);
    if (!x || !y) return false;
    if (x === y) return true;
    const short = x.length <= y.length ? x : y;
    const long = x.length <= y.length ? y : x;
    return short.length >= 6
      && long.length === short.length + 3
      && long.indexOf(short) === 0
      && /^\d{3}$/.test(long.slice(short.length));
  }

  function parseFinalList(text){
    const lines = text.split(/\r?\n/).filter(l => l.trim());
    if (!lines.length) return [];
    const header = detectHeader(splitCells(lines[0]));
    const dataLines = header ? lines.slice(1) : lines;
    const out = [];
    dataLines.forEach(line => {
      const cells = splitCells(line);
      const hit = header ? headerRow(cells, header) : parseCells(cells);
      if (hit && hit.amount > 0) out.push({ no: hit.no || '', name: hit.name, qty: hit.qty, amount: hit.amount });
    });
    return out;
  }

  // 结算表的每一行是一个「名额」，被登记表的某一行吃掉之后就不能再被别人吃。
  // 同一个品番在结算表里出现两行（同一本要了 2 本）时，两行会一起算给那一行登记，
  // 而不是重复拿同一行去顶两次。
  function matchAgainst(pool, it){
    const want = Math.max(1, it.qty | 0);
    const hits = [];
    let got = 0;
    const take = test => {
      for (const c of pool){
        if (got >= want) break;
        if (c.used || !test(c)) continue;
        c.used = true; hits.push(c); got += c.qty;
      }
    };
    // 从最可靠往最勉强退：品番 > 整串品名 > 削掉分类前缀的核心标题 > 互相包含 >
    // 品名相似度。后两级只在「答案唯一」时才认——认错人是把别人的结算金额算到这件
    // 商品上，比漏掉难查得多，宁可报未购入让人自己看。
    if (it.no) take(c => noMatch(c.no, it.no));
    let how = hits.length ? 'no' : '';
    const byNo = hits.length > 0;

    if (!hits.length && it.name){
      const k1 = normName(it.name), k2 = coreName(it.name), nums = numsOf(k2);
      take(c => normName(c.name) === k1);
      if (hits.length) how = 'name';
      if (!hits.length && k2){
        take(c => coreName(c.name) === k2);
        if (hits.length) how = 'core';
      }
      if (!hits.length && k2){
        const free = pool.filter(c => !c.used && numsOf(coreName(c.name)) === nums);
        const part = free.filter(c => {
          const ck = coreName(c.name);
          return ck && Math.min(ck.length, k2.length) >= 8 &&
            (ck.indexOf(k2) !== -1 || k2.indexOf(ck) !== -1);
        });
        if (part.length === 1){
          take(c => c === part[0]); how = 'part';
        } else {
          // 相似度要够高，而且要明显甩开第二名。只剩一个候选时没有第二名可比，门槛提到
          // 0.85——「（呪）まとめ本 2」跟「3」的相似度有 91%，光靠相似度是挡不住的，
          // 真正挡住它的是上面那条「数字必须一致」。
          const bg = bigrams(k2);
          const scored = free.map(c => ({ c, s: diceSim(bigrams(coreName(c.name)), bg) }))
            .sort((x, y) => y.s - x.s);
          if (scored.length && (scored.length > 1
                ? (scored[0].s >= 0.72 && scored[0].s - scored[1].s >= 0.08)
                : scored[0].s >= 0.85)){
            take(c => c === scored[0].c);
            how = 'fuzzy';
          }
        }
      }
    }

    if (!hits.length){
      // 结算表里找不到 = 这件没买到。价格一律不再回退去用登记表原价 × 折扣，
      // 而是整行标成未购入，后面金额、件数、总点数都绕开它。
      it.settled = false;
      it.settleAmt = null;
      it.missing = true;
      return null;
    }

    const amount = Math.round(hits.reduce((s, h) => s + h.amount, 0));
    const qty = hits.reduce((s, h) => s + h.qty, 0);
    if (it.origPrice == null) it.origPrice = it.price;
    if (!it.no && hits[0].no) it.no = hits[0].no;
    it.settled = true;
    it.missing = false;
    it.settleAmt = amount;   // 结算表「金額」列，已含折扣、已是整数日元
    it.qty = qty;            // 以结算表实际买到的本数为准
    it.price = Math.round(amount / qty);
    return { qty, byNo, how, first: hits[0] };
  }

  $('finalizeBtn').addEventListener('click', () => {
    const finalNote = $('finalizeNote');
    const list = parseFinalList($('finalizeText').value);
    if (!list.length){
      finalNote.textContent = '没识别到结算表内容（至少要有品名和金额/单价），检查一下格式。';
      return;
    }

    if (!readItems().length && !batchGroups){
      finalNote.textContent = '登记表还是空的。二次核算是拿结算表去核对上面「商品明细」里' +
        '已经有的商品，请先用上面的「表格导入」把这批商品导进来（或者手动填好），再回来核对。';
      return;
    }

    const pool = list.map(l => ({ ...l, used: false }));
    const missed = [];
    const fuzzyList = [];   // 品番没对上、靠品名近似认出来的，要单独列出来让人复核
    let matched = 0, byNo = 0, regCount = 0, regWithNo = 0;
    const apply = its => its.forEach(it => {
      regCount++;
      if (it.no) regWithNo++;            // 必须在回填品番之前数
      const hit = matchAgainst(pool, it);
      if (!hit){ missed.push(it); return; }
      matched += hit.qty;
      if (hit.byNo) byNo += hit.qty;
      if (hit.how === 'part' || hit.how === 'fuzzy'){
        fuzzyList.push(brief(displayName(it.name), 20) + ' → ' + brief(displayName(hit.first.name), 20));
      }
    });

    // 小票上标绿是给人「这件要看一眼」的信号，所以只能标真正反常的那几件。
    // 一整批走同一个折扣是常态（登记 ¥350 收 ¥263，全批都这样），把它们全标绿
    // 等于什么都没标。反常的是折扣比例跟大多数不一样的那几件——最典型的就是
    // 新品、CD、雑貨这种压根不参与本次折扣的，客户看到会问「为什么这本没便宜」。
    // 取全批「结算价 ÷ 登记价」的中位数当作这批的常态，偏离超过 2 个百分点才标。
    // 这里只决定标不标绿，不碰任何金额——钱一律以结算表为准。
    function markOutliers(all){
      const settled = all.filter(i => i.settled && !i.missing);
      settled.forEach(i => { i.odd = false; i.oddWhy = ''; });
      const ratios = settled
        .map(i => { const base = (i.origPrice != null ? i.origPrice : i.price) * i.qty;
                    return base > 0 ? i.settleAmt / base : null; })
        .filter(r => r != null);
      if (!ratios.length) return;
      // 不足 3 件时没有「这批的常态」可言，退回字面意思：结算价跟登记价不一样就标。
      const sorted = ratios.slice().sort((a, b) => a - b);
      const norm = ratios.length < 3 ? 1
        : (sorted.length % 2 ? sorted[(sorted.length - 1) / 2]
           : (sorted[sorted.length / 2 - 1] + sorted[sorted.length / 2]) / 2);
      settled.forEach(i => {
        const base = (i.origPrice != null ? i.origPrice : i.price) * i.qty;
        if (!(base > 0)) return;
        const r = i.settleAmt / base;
        if (Math.abs(r - norm) <= 0.02) return;
        i.odd = true;
        i.oddWhy = r >= norm
          ? (Math.abs(r - 1) <= 0.02 ? '没参与本批折扣' : '折扣比别人少')
          : '比本批折扣更低';
      });
    }

    if (batchGroups){
      // 整批一起核对：只核当前这位客户的话，「本次总点数」还是登记表的行数，
      // 所有按点数平摊的费用分母就都是错的。
      syncActiveGroup();
      batchGroups.forEach(its => apply(its));
      const everyone = [];
      batchGroups.forEach(its => everyone.push(...its));
      markOutliers(everyone);          // 常态要看整批，不能只看当前这位客户
      recalcBatchTotal();
      renderBatchChips();
      if (activeBatchTag) loadBatchGroup(activeBatchTag);
      else $('batchQty').value = batchQtyTotal;
    } else {
      const its = readItems().map(stripEl);
      apply(its);
      markOutliers(its);
      renderRows(its);
    }
    render();
    $('finalizeText').value = '';

    const leftover = pool.filter(p => !p.used);
    const spent = pool.filter(p => p.used).reduce((s, p) => s + p.amount, 0);
    // 长标题一条条铺开会变成一堵读不下去的墙，最多列 5 条，剩下的报个数。
    const listOf = (arr, max) => arr.slice(0, max || 5).join('、') +
      (arr.length > (max || 5) ? ' 等 ' + arr.length + ' 条' : '');

    const msg = ['结算表 ' + list.length + ' 行，登记表 ' + regCount + ' 件（' + regWithNo +
      ' 件有品番），对上 ' + matched + ' 件，合计 ' + fmtJ(spent)];
    if (byNo && matched > byNo) msg.push(byNo + ' 件按品番匹配，其余靠品名');
    else if (byNo) msg.push('全部按品番匹配');
    else if (matched) msg.push('全部靠品名匹配（品番没对上，不如品番可靠，建议核一遍）');

    // 一件都没对上时，光把几十条日文标题倒出来说"检查一下"没有任何用——
    // 直接把两边的品番摆出来，是哪一头出的问题一眼就能看见。
    if (!matched){
      const sampleNo = arr => arr.filter(x => x.no).slice(0, 3).map(x => x.no).join('、');
      const regs = []; if (batchGroups) batchGroups.forEach(its => regs.push(...its)); else regs.push(...readItems());
      if (!regWithNo){
        msg.push('⚠ 一件都没对上，而且登记表里一个品番都没有。二次核算最靠得住的就是按品番匹配，' +
          '请在「表格导入」时把登记表的「编号」列或者「商品链接」列一起粘进来' +
          '（骏河屋链接末段就是品番，工具会自动提取），或者先把结算表的品番填进明细的编号栏');
      } else {
        msg.push('⚠ 一件都没对上：登记表里的品番形如「' + (sampleNo(regs) || '（空）') +
          '」，结算表里的形如「' + (sampleNo(list) || '（空）') + '」，两边不是同一套编号；' +
          '品名也没对上（结算表的标题带「中古女性向け一般同人誌（BL含む）」这种分类前缀，' +
          '跟登记表里复制的标题写法不一样）');
      }
    }

    if (fuzzyList.length) msg.push('⚠ 有 ' + fuzzyList.length + ' 件品番对不上、是按品名近似认出来的，' +
      '请自己核一遍：' + listOf(fuzzyList, 4));
    if (missed.length) msg.push('未购入 ' + missed.length + ' 件（不计费）：' + listOf(missed.map(labelOf)));
    if (leftover.length) msg.push('结算表有 ' + leftover.length + ' 行没对上登记表（这几行的钱没算给任何人，' +
      '多半是登记表里漏记了，或者品番/标题跟登记的不一样）：' + listOf(leftover.map(labelOf)));
    if (batchGroups) msg.push('本次总点数已改为 ' + batchQtyTotal + ' 点');
    finalNote.textContent = msg.join('；') + '。';

    console.info('[二次核算] 对上 ' + matched + ' 件，合计 ' + fmtJ(spent) +
      (batchGroups ? '，本次总点数 ' + batchQtyTotal + ' 点' : ''));
    if (missed.length) console.warn('[二次核算] 登记表有、结算表没有（按未购入处理，不计费）：', missed.map(labelOf));
    if (leftover.length) console.warn('[二次核算] 结算表有、登记表没有（没人认领）：', leftover.map(labelOf));
  });

  /* ---------- 计算 ---------- */
  const fmtJ = n => '¥' + Math.round(n).toLocaleString('en-US');
  const fmtC = n => n.toFixed(2) + ' 元';
  const round2 = n => Math.round(n * 100) / 100;

  function roundUp(n, mode){
    if (mode === 'jiao') return Math.ceil(n * 10) / 10;
    if (mode === 'yuan') return Math.ceil(n);
    return Math.round(n * 100) / 100;
  }

  function compute(){
    const all = readItems();
    const zhe = Math.min(10, Math.max(0, +$('discount').value || 10));
    const k = zhe / 10;
    const rate = Math.max(0.0001, +$('rate').value || 0.046);
    const feeTotal = Math.max(0, +$('fee').value || 0);
    const feeCur = segValue('feeCurSeg') || 'JPY';
    const shipTotal = Math.max(0, +$('ship').value || 0);
    const mode = segValue('roundSeg') || 'none';

    // 结算表里没有的商品 = 没买到。除了在小票上单独列一行交代，件数、金额、
    // 平摊分母一律不算它。
    const ownQty = all.filter(i => !i.missing).reduce((s, i) => s + i.qty, 0);
    const batchQtyInput = +$('batchQty').value || 0;
    const batchProvided = batchQtyInput > 0;
    const batchQty = batchProvided ? batchQtyInput : ownQty;

    const feeCNY = feeCur === 'CNY' ? feeTotal : feeTotal * rate;
    const shipCNY = shipTotal * rate;
    const perUnitFeeCNY = batchQty ? feeCNY / batchQty : 0;
    const perUnitFeeRaw = batchQty ? feeTotal / batchQty : 0;
    const perUnitShipCNY = batchQty ? shipCNY / batchQty : 0;
    const perUnitShipRaw = batchQty ? shipTotal / batchQty : 0;

    // 逐行算日元。核过价的行直接用结算表「金額」列——骏河屋是逐本扣整数日元的，
    // 该行的折扣它自己已经算进去了（有的商品压根不打折），拿登记原价再乘一次折扣
    // 只会算错。没核过价的行才用 原价 × 折扣，同样进位到整数日元，
    // 这样小票上写的 ¥488 和实际用来换人民币的就是同一个数，不会差那五毛。
    const lines = all.map(i => {
      const base = i.origPrice != null ? i.origPrice : i.price;
      const grossJ = base * i.qty;
      const rawExpect = (i.noDiscount ? base : base * k) * i.qty;
      const expectJ = Math.ceil(rawExpect);
      const netJ = i.missing ? 0 : (i.settled ? i.settleAmt : expectJ);
      // 标绿 = 这件跟这批其他商品不一样（见二次核算里的 markOutliers）。
      // 以前是拿「原价 × 折扣」去比，可 B 这套本来就不反推折扣比例，折扣栏永远是 10，
      // 于是每一件打过折的都被判成"有变动"，满屏绿字，等于什么都没标。
      const adjusted = !!i.settled && !i.missing && !!i.odd;
      const cny = i.missing ? 0 : round2(netJ * rate + (perUnitFeeCNY + perUnitShipCNY) * i.qty);
      return { ...i, grossJ, netJ, expectJ, adjusted, cny };
    });

    const items = lines.filter(l => !l.missing);
    const missingItems = lines.filter(l => l.missing);
    const grossJ = items.reduce((s, l) => s + l.grossJ, 0);
    const netJ = items.reduce((s, l) => s + l.netJ, 0);
    const exemptQty = items.filter(l => l.noDiscount && !l.settled).reduce((s, l) => s + l.qty, 0);
    const settledQty = items.filter(l => l.settled).reduce((s, l) => s + l.qty, 0);
    const missingQty = missingItems.reduce((s, l) => s + l.qty, 0);

    // 平摊出来的钱先落到分再进合计：小票上写多少就加多少。
    // 以前这里留着没取整的小数，通讯费小到显示成 ¥0 时，合计里还是会莫名多出几分钱。
    const feeShareCNY = round2(perUnitFeeCNY * ownQty);
    const shipShareCNY = round2(perUnitShipCNY * ownQty);
    const goodsCNY = round2(netJ * rate);
    const rawTotal = round2(goodsCNY + feeShareCNY + shipShareCNY);
    const total = roundUp(rawTotal, mode);

    return { items, missingItems, allItems: lines, zhe, k, rate, feeTotal, feeCur, feeCNY, shipTotal, shipCNY,
             perUnitFeeCNY, perUnitFeeRaw, perUnitShipCNY, perUnitShipRaw, feeShareCNY, shipShareCNY,
             ownQty, batchQty, batchProvided, grossJ, netJ, goodsCNY,
             exemptQty, settledQty, missingQty, rawTotal, total, mode };
  }

  /* ---------- 小票绘制 ---------- */
  const W = 520, PAD = 40, PW = W - PAD*2, TOP = 26, TOOTH = 11, TH = 7;

  function buildLines(d){
    const L = [];
    L.push({t:'title', v:'骏河屋代购 · 费用清单'});
    L.push({t:'sub', v:'SURUGA-YA ORDER'});
    L.push({t:'gap', h:10});
    L.push({t:'rule'});
    const cust = $('cust').value.trim();
    L.push({t:'kv', a:'客户', b:cust || '-'});
    L.push({t:'kv', a:'日期', b:$('date').value || ''});
    const no = $('no').value.trim();
    if (no) L.push({t:'kv', a:'单号', b:no});
    L.push({t:'kv', a:'购买件数', b:d.ownQty + ' 件'});
    if (d.batchProvided) L.push({t:'kv', a:'本次总点数', b:d.batchQty + ' 点'});
    L.push({t:'rule'});

    if (!d.items.length){
      L.push({t:'gap', h:6});
      L.push({t:'center', v:'还没有商品'});
      L.push({t:'gap', h:6});
    } else {
      d.items.forEach((it, n) => {
        L.push({t:'item', n:n+1, it, d});
      });
    }

    // 没买到的单独列出来交代一句，不计进任何金额，方便直接截图跟客户说明
    if (d.missingItems.length){
      L.push({t:'rule'});
      L.push({t:'text', v:'未购入 ' + d.missingQty + ' 件 · 结算表里没有，不计费'});
      d.missingItems.forEach(it => L.push({t:'miss', it}));
    }

    L.push({t:'rule'});
    L.push({t:'kv', a:'商品原价', b:fmtJ(d.grossJ)});
    const cut = d.grossJ - d.netJ;
    if (Math.abs(cut) > 0.5){
      const notes = [];
      if (d.settledQty) notes.push('以结算价为准');
      if (d.exemptQty) notes.push(d.exemptQty + ' 件原价结算');
      const head = d.settledQty ? '优惠合计' : '折扣  ' + d.zhe + ' 折';
      L.push({t:'kv', a:head + (notes.length ? '（' + notes.join('，') + '）' : ''),
              b:(cut >= 0 ? '-' : '+') + fmtJ(Math.abs(cut))});
      L.push({t:'kv', a:d.settledQty ? '结算金额' : '折后金额', b:fmtJ(d.netJ)});
    }
    L.push({t:'kv', a:'汇率  1 日元 = ' + d.rate + ' 元', b:fmtC(d.goodsCNY)});
    // 平摊金额四舍五入到分之后还是 0 的（通讯费为 0、或小到不足半分）就不画这行，
    // 也不进合计——以前这里按原始总额判断，会出现「× ¥0」却收 0.02 元的怪事。
    // 写成「总额 ÷ 总点数 × 本人件数」而不是「件数 × 每件单价」：每件摊到的钱常常带
    // 一长串小数，显示成取整后的单价，客户自己乘一遍对不上，还会以为多收了。
    const share = (name, totalStr, cny) =>
      L.push({t:'kv', a:name + '平摊  ' + totalStr + ' ÷ ' + d.batchQty + ' 点 × ' + d.ownQty + ' 件', b:fmtC(cny)});
    if (d.feeShareCNY > 0) share('通讯费', d.feeCur === 'CNY' ? fmtC(d.feeTotal) : fmtJ(d.feeTotal), d.feeShareCNY);
    if (d.shipShareCNY > 0) share('运费', fmtJ(d.shipTotal), d.shipShareCNY);
    L.push({t:'formula', v:buildFormula(d)});
    if (d.items.some(i => i.adjusted)){
      L.push({t:'centerok', v:'绿色那几件的折扣跟本批其他商品不同'});
    }
    if (d.settledQty){
      L.push({t:'center', v:'金额以骏河屋结算单实扣日元为准'});
    }
    if (d.exemptQty){
      L.push({t:'center', v:'标「原价」的商品不参与本单折扣'});
    }
    L.push({t:'rule'});
    L.push({t:'total', a:'应付合计', b:fmtC(d.total)});
    if (Math.abs(d.total - d.rawTotal) > 0.004){
      L.push({t:'kvs', a:'（原 ' + d.rawTotal.toFixed(2) + ' 元，' + (d.mode==='yuan'?'进位到元':'进位到角') + '）', b:''});
    }
    L.push({t:'rule'});
    L.push({t:'gap', h:4});
    L.push({t:'center', v:'共 ' + d.ownQty + ' 件 · 请核对后付款'});
    return L;
  }

  function buildFormula(d){
    const jpy = n => Math.round(n).toLocaleString('en-US');
    // 核过价、或者有商品不参与折扣时，「原价 × 折扣」这套公式跟实际金额对不上了
    // （结算价里折扣已经算完，免折的那部分压根没打折），公式直接从逐行算好的
    // 日元合计起步，不再展示整单折扣倍率。
    const plain = !d.settledQty && !d.exemptQty;
    let f = plain ? jpy(d.grossJ) : jpy(d.netJ);
    if (plain && d.zhe < 10) f += ' × ' + d.k.toFixed(2);
    f += ' × ' + d.rate;
    const extra = round2(d.feeShareCNY + d.shipShareCNY);
    if (extra > 0) f = '(' + f + ') + ' + extra.toFixed(2);
    f += ' = ' + d.total.toFixed(2) + ' 元';
    return f;
  }

  const H = {title:34, sub:20, gap:0, rule:16, kv:23, kvs:19, item:40, miss:21, total:38, text:20, center:22, centerok:20, formula:22};

  function drawReceipt(scale){
    const d = compute();
    const L = buildLines(d);
    let body = 0;
    L.forEach(l => body += (l.t === 'gap' ? l.h : H[l.t]));
    const paperH = 34 + body + 34;
    const H_ = TOP + paperH + TOP;

    cv.width = W * scale;
    cv.height = H_ * scale;
    cv.style.aspectRatio = W + '/' + H_;
    ctx.setTransform(scale, 0, 0, scale, 0, 0);

    // 背景
    ctx.fillStyle = '#EAF3FC';
    ctx.fillRect(0, 0, W, H_);

    // 纸张（上下锯齿）
    const x0 = PAD, x1 = W - PAD, y0 = TOP, y1 = TOP + paperH;
    ctx.beginPath();
    ctx.moveTo(x0, y0);
    for (let x = x0; x < x1; x += TOOTH){
      ctx.lineTo(Math.min(x + TOOTH/2, x1), y0 - TH);
      ctx.lineTo(Math.min(x + TOOTH, x1), y0);
    }
    ctx.lineTo(x1, y1);
    for (let x = x1; x > x0; x -= TOOTH){
      ctx.lineTo(Math.max(x - TOOTH/2, x0), y1 + TH);
      ctx.lineTo(Math.max(x - TOOTH, x0), y1);
    }
    ctx.closePath();
    ctx.save();
    ctx.shadowColor = 'rgba(18,50,78,.18)';
    ctx.shadowBlur = 16;
    ctx.shadowOffsetY = 5;
    ctx.fillStyle = '#FFFFFF';
    ctx.fill();
    ctx.restore();

    // 品牌色条
    ctx.save();
    ctx.clip();
    ctx.fillStyle = '#1768C9';
    ctx.fillRect(x0, y0, x1 - x0, 6);
    ctx.restore();

    // 内容
    const IL = x0 + 22, IR = x1 - 22, IW = IR - IL;
    let y = y0 + 34;
    const ink = '#12324E', fade = '#5D7B96', acc = '#D8472E', brand = '#1768C9', ok = '#1E8A4C';

    const right = (txt, yy) => { ctx.textAlign = 'right'; ctx.fillText(txt, IR, yy); ctx.textAlign = 'left'; };
    const clip = (txt, max) => {
      if (ctx.measureText(txt).width <= max) return txt;
      let s = txt;
      while (s.length > 1 && ctx.measureText(s + '…').width > max) s = s.slice(0, -1);
      return s + '…';
    };
    const dash = yy => {
      ctx.strokeStyle = '#CBDCEC'; ctx.lineWidth = 1;
      ctx.setLineDash([3, 3]);
      ctx.beginPath(); ctx.moveTo(IL, yy + .5); ctx.lineTo(IR, yy + .5); ctx.stroke();
      ctx.setLineDash([]);
    };

    ctx.textBaseline = 'alphabetic';

    L.forEach(l => {
      if (l.t === 'gap'){ y += l.h; return; }
      if (l.t === 'title'){
        ctx.fillStyle = brand; ctx.font = '700 19px ' + MONO;
        ctx.textAlign = 'center'; ctx.fillText(l.v, (IL+IR)/2, y + 20); ctx.textAlign = 'left';
      } else if (l.t === 'sub'){
        ctx.fillStyle = fade; ctx.font = '400 11px ' + DIGIT;
        ctx.textAlign = 'center'; ctx.fillText(l.v, (IL+IR)/2, y + 12); ctx.textAlign = 'left';
      } else if (l.t === 'rule'){
        dash(y + 8);
      } else if (l.t === 'kv'){
        ctx.font = '400 13px ' + MONO; ctx.fillStyle = fade;
        ctx.fillText(l.a, IL, y + 15);
        ctx.fillStyle = ink; right(l.b, y + 15);
      } else if (l.t === 'kvs'){
        ctx.font = '400 11px ' + MONO; ctx.fillStyle = fade;
        ctx.textAlign = 'right'; ctx.fillText(l.a, IR, y + 13); ctx.textAlign = 'left';
      } else if (l.t === 'item'){
        const it = l.it, dd = l.d;
        ctx.font = '500 13.5px ' + MONO; ctx.fillStyle = ink;
        ctx.fillText(clip(l.n + '. ' + (displayName(it.name) || '未命名'), IW - 4), IL, y + 15);
        ctx.font = '400 12px ' + MONO; ctx.fillStyle = it.adjusted ? ok : fade;
        const unit = it.origPrice != null ? it.origPrice : it.price;
        let sub = '   ' + fmtJ(unit) + ' × ' + it.qty;
        if (it.settled) sub += '  结算 ' + fmtJ(it.netJ);
        else if (it.noDiscount) sub += '  原价不打折';
        else if (dd.zhe < 10) sub += '  折后 ' + fmtJ(it.netJ);
        // 「已核价」不再逐行写：整批都是核过的，逐行写等于没写，末尾一句话交代就够。
        if (it.adjusted && it.oddWhy) sub += '  ' + it.oddWhy;
        ctx.fillText(sub, IL, y + 33);
        ctx.font = '500 14px ' + DIGIT; ctx.fillStyle = it.adjusted ? ok : ink;
        right(fmtC(it.cny), y + 33);
      } else if (l.t === 'miss'){
        const it = l.it;
        ctx.font = '400 12.5px ' + MONO; ctx.fillStyle = fade;
        const txt = clip(labelOf(it), IW - 62);
        ctx.fillText(txt, IL, y + 14);
        ctx.strokeStyle = fade; ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(IL, y + 9.5); ctx.lineTo(IL + ctx.measureText(txt).width, y + 9.5);
        ctx.stroke();
        ctx.font = '400 11px ' + MONO;
        right('未购入', y + 14);
      } else if (l.t === 'centerok'){
        ctx.font = '500 11.5px ' + MONO; ctx.fillStyle = ok;
        ctx.textAlign = 'center'; ctx.fillText(l.v, (IL+IR)/2, y + 14); ctx.textAlign = 'left';
      } else if (l.t === 'total'){
        ctx.font = '700 15px ' + MONO; ctx.fillStyle = ink;
        ctx.fillText(l.a, IL, y + 22);
        ctx.font = '700 24px ' + DIGIT; ctx.fillStyle = acc;
        right(l.b, y + 24);
      } else if (l.t === 'text'){
        ctx.font = '400 12px ' + MONO; ctx.fillStyle = fade;
        ctx.fillText(clip(l.v, IW), IL, y + 14);
      } else if (l.t === 'center'){
        ctx.font = '400 11.5px ' + MONO; ctx.fillStyle = fade;
        ctx.textAlign = 'center'; ctx.fillText(l.v, (IL+IR)/2, y + 14); ctx.textAlign = 'left';
      } else if (l.t === 'formula'){
        ctx.font = '400 12px ' + DIGIT; ctx.fillStyle = fade;
        ctx.textAlign = 'center'; ctx.fillText(clip(l.v, IW), (IL+IR)/2, y + 15); ctx.textAlign = 'left';
      }
      y += H[l.t];
    });

    return d;
  }

  // 表单里的标绿/划线状态跟着计算结果走：结算价跟「原价 × 折扣」对不上的标绿，
  // 结算表里没有的整行划掉。
  function paintRows(d){
    d.allItems.forEach(it => {
      if (!it.el || !it.el.isConnected) return;
      const p = it.el.querySelector('.i-price');
      p.classList.toggle('price-adjusted', it.adjusted);
      if (it.adjusted){
        p.title = '登记原价 ' + fmtJ(it.origPrice) + ' × ' + it.qty +
                  ' → 结算实扣 ' + fmtJ(it.settleAmt) + '（按折扣本该 ' + fmtJ(it.expectJ) + '）';
      } else {
        p.removeAttribute('title');
      }
      markRow(it.el);
    });
  }

  function render(){
    const dpr = Math.min(3, window.devicePixelRatio || 1);
    paintRows(drawReceipt(Math.max(2, dpr)));
    save();
  }

  /* ---------- 导出 ---------- */
  function filename(){
    const c = $('cust').value.trim() || '代购';
    const n = $('no').value.trim();
    return [c, n, $('date').value].filter(Boolean).join('-') + '.png';
  }

  $('dl').addEventListener('click', () => {
    drawReceipt(3);
    const a = document.createElement('a');
    a.download = filename();
    a.href = cv.toDataURL('image/png');
    a.click();
    render();
    if (batchGroups && activeBatchTag){
      batchDone.add(activeBatchTag);
      renderBatchChips();
    }
    noteEl.textContent = '已下载。';
  });

  $('cp').addEventListener('click', async () => {
    drawReceipt(3);
    try{
      const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
      await navigator.clipboard.write([new ClipboardItem({'image/png': blob})]);
      noteEl.textContent = '已复制，可以直接粘贴到微信。';
    }catch(e){
      noteEl.textContent = '这个浏览器不支持复制图片，用「下载小票」吧。';
    }
    render();
  });

  /* ---------- 记住设置 ---------- */
  const KEY = 'daigou:settings';
  // 只记汇率/折扣/尾数这些每批都一样的设置。通讯费和运费是每批现算的金额，
  // 记住它等于把上一批的数悄悄带到这一批，明明这批没通讯费，合计里却多出几分钱。
  function save(){
    try{
      localStorage.setItem(KEY, JSON.stringify({
        rate: $('rate').value, discount: $('discount').value,
        feeCur: segValue('feeCurSeg'), round: segValue('roundSeg')
      }));
    }catch(e){}
  }
  function load(){
    try{
      const raw = localStorage.getItem(KEY);
      if (!raw) return;
      const s = JSON.parse(raw);
      ['rate','discount'].forEach(k => { if (s[k] != null) $(k).value = s[k]; });
      if (s.feeCur) setSeg('feeCurSeg', s.feeCur);
      if (s.round) setSeg('roundSeg', s.round);
    }catch(e){}
  }

  /* ---------- 启动 ---------- */
  $('addRow').addEventListener('click', () => { addRow({}); render(); });
  document.addEventListener('input', render);
  document.addEventListener('change', render);
  window.addEventListener('resize', () => drawReceipt(Math.max(2, window.devicePixelRatio || 1)));

  const t = new Date();
  $('date').value = t.toISOString().slice(0,10);
  $('no').value = 'SY' + String(t.getMonth()+1).padStart(2,'0') + String(t.getDate()).padStart(2,'0')
                  + '-' + String(Math.floor(Math.random()*900+100));

  addRow({});
  load();
  render();

  // 留给控制台核对用：core.compute() 看这一单的明细，core.batch() 看整批谁买到了什么。
  window.daigou = {
    compute,
    batch: () => batchGroups && [...batchGroups.entries()].map(([tag, its]) => ({
      tag, 件数: boughtQty(its), 未购入: its.filter(i => i.missing).map(labelOf)
    }))
  };
})();
</script>
</body>
</html>
